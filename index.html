<script>
/* =========================================================================
   APPCC Cocina · interfaz para tablet
   ========================================================================= */
const ALERGENOS = [
  ['Gluten','🌾'],['Crustáceos','🦐'],['Huevos','🥚'],['Pescado','🐟'],['Cacahuetes','🥜'],['Soja','🫘'],['Lácteos','🥛'],
  ['Frutos de cáscara','🌰'],['Apio','🥬'],['Mostaza','🟡'],['Sésamo','⚪'],['Sulfitos','🍷'],['Altramuces','🌼'],['Moluscos','🐚']
];
const DIAS = ['', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
const DIA_LETRA = { L: 1, M: 2, X: 3, J: 4, V: 5 };
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

const S = { token: null, user: null, conf: null, ajustes: {}, estado: null, hoy: null, turnoId: null, grupoId: null,
  view: 'home', params: {}, urlApp: '', publico: null, cola: [] };

/* ---------------- utilidades ---------------- */
const $ = (s, el) => (el || document).querySelector(s);
const e = (s) => String(s === undefined || s === null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fc = (f) => { if (!f) return ''; const p = String(f).slice(0,10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; };
const fcc = (f) => { if (!f) return ''; const p = String(f).slice(0,10).split('-'); return p[2] + '/' + p[1]; };
const fLarga = (f) => { const d = new Date(f + 'T12:00:00'); return DIAS[d.getDay() === 0 ? 7 : d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()]; };
const dow = (f) => { const d = new Date(f + 'T12:00:00').getDay(); return d === 0 ? 7 : d; };
const sumarDias = (f, n) => { const d = new Date(f + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); };
const lunesDe = (f) => sumarDias(f, 1 - dow(f));
const ahoraHM = () => { const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
const ahoraTs = () => { const d = new Date(); const z = (n) => String(n).padStart(2,'0'); return d.getFullYear() + '-' + z(d.getMonth()+1) + '-' + z(d.getDate()) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes()); };
const num = (v) => { if (v === '' || v === null || v === undefined) return null; const n = Number(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
const arr = (v) => { if (Array.isArray(v)) return v; try { const x = JSON.parse(v); return Array.isArray(x) ? x : []; } catch (_) { return []; } };
const byId = (lista, id) => (S.conf[lista] || []).find(x => String(x.id) === String(id));
const act = (lista) => (S.conf[lista] || []).filter(x => x.activo !== false);
const nombre = (lista, id, def) => { const x = byId(lista, id); return x ? x.nombre : (def === undefined ? '' : def); };
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (_) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }, del(k) { try { localStorage.removeItem(k); } catch (_) {} } };

function rango(min, max, u) {
  u = u || '°C';
  const c = (v) => String(v).replace('.', ',');
  if (min !== null && max !== null) return 'Entre ' + c(min) + ' y ' + c(max) + ' ' + u;
  if (max !== null) return 'Máximo ' + c(max) + ' ' + u;
  if (min !== null) return 'Mínimo ' + c(min) + ' ' + u;
  return 'Sin límite';
}
const nf = (v) => String(v === undefined || v === null ? '' : v).replace('.', ',');
const enRango = (v, min, max) => (min === null || v >= min) && (max === null || v <= max);

/* ---------------- servidor ---------------- */
function llamar(nombreFn, args, opt) {
  opt = opt || {};
  if (!opt.silencio) cargando(true);
  return new Promise((res, rej) => {
    const fin = () => { if (!opt.silencio) cargando(false); };
    if (!window.google || !google.script) { fin(); rej(new Error('Sin conexión con Google')); return; }
    google.script.run
      .withSuccessHandler((txt) => {
        fin();
        let o; try { o = JSON.parse(txt); } catch (_) { rej(new Error('Respuesta no válida')); return; }
        if (o.ok) res(o.data);
        else if (o.error === 'SESION') { cerrarSesionLocal(); toast('La sesión ha caducado. Vuelve a entrar.', 'bad'); rej(new Error('SESION')); }
        else rej(new Error(o.error));
      })
      .withFailureHandler((err) => { fin(); const x = new Error('RED'); x.detalle = err; rej(x); })
      .api(nombreFn, JSON.stringify(args || []));
  });
}
async function guardar(tipo, datos) {
  datos = Object.assign({}, datos, { clienteTs: ahoraTs() });
  try {
    const r = await llamar('guardar', [S.token, tipo, datos]);
    if (r.estado) S.estado = r.estado;
    return r.registro;
  } catch (err) {
    if (err.message === 'RED') {
      S.cola.push({ tipo, datos });
      store.set('appcc_cola', S.cola);
      toast('Sin conexión: el registro se guardará solo cuando vuelva la red.', 'bad');
      return { __cola: true };
    }
    throw err;
  }
}
async function vaciarCola() {
  if (!S.cola.length || !S.token) return;
  const pend = S.cola.slice();
  for (const x of pend) {
    try {
      await llamar('guardar', [S.token, x.tipo, x.datos], { silencio: true });
      S.cola.shift(); store.set('appcc_cola', S.cola);
    } catch (err) {
      if (err.message === 'RED') break;
      S.cola.shift(); store.set('appcc_cola', S.cola);
      toast('Un registro sin conexión no se pudo guardar: ' + err.message, 'bad');
    }
  }
  if (!S.cola.length) { toast('Registros pendientes enviados ✔', 'ok'); refrescar(true); }
}

/* ---------------- interfaz básica ---------------- */
let tToast = null;
function toast(msg, tipo) {
  let el = $('#toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.className = 'toast ' + (tipo || ''); el.textContent = msg; el.style.display = 'block';
  clearTimeout(tToast); tToast = setTimeout(() => el.style.display = 'none', tipo === 'bad' ? 5200 : 2800);
}
let nCarga = 0;
function cargando(on) {
  nCarga += on ? 1 : -1; if (nCarga < 0) nCarga = 0;
  let el = $('#load');
  if (nCarga > 0 && !el) { el = document.createElement('div'); el.id = 'load'; el.className = 'load'; el.innerHTML = '<div class="spin"></div>'; document.body.appendChild(el); }
  if (nCarga === 0 && el) el.remove();
}
function errorUI(err) { if (err && err.message !== 'SESION') toast(err.message === 'RED' ? 'No hay conexión. Inténtalo de nuevo.' : err.message, 'bad'); }

let modalResolver = null;
function abrirModal(html, onClose) {
  $('#modal').innerHTML = '<div class="ov" data-act="ovClick"><div class="md" role="dialog">' + html + '</div></div>';
  modalResolver = onClose || null;
}
function cerrarModal(valor) {
  $('#modal').innerHTML = '';
  const r = modalResolver; modalResolver = null;
  if (r) r(valor);
}

/* ---- teclado numérico ---- */
function teclado(opt) {
  return new Promise((resolve) => {
    let v = opt.inicial !== undefined && opt.inicial !== null ? String(opt.inicial).replace('.', ',') : '';
    const min = opt.min === undefined ? null : opt.min, max = opt.max === undefined ? null : opt.max;
    const pintar = () => {
      const d = $('#kpD'); if (!d) return;
      d.textContent = (v === '' ? '—' : v) + ' ' + (opt.unidad || '');
      const n = num(v);
      d.className = 'disp' + (n === null || (min === null && max === null) ? '' : (enRango(n, min, max) ? ' ok' : ' bad'));
      const ri = $('#kpR');
      if (ri && n !== null && (min !== null || max !== null)) ri.innerHTML = enRango(n, min, max) ? '<span style="color:#15803D">✔ Dentro del límite</span>' : '<span style="color:#DC2626">✖ Fuera del límite</span>';
      else if (ri) ri.textContent = (min !== null || max !== null) ? 'Límite: ' + rango(min, max, opt.unidad) : '';
    };
    window.__kp = (k) => {
      if (k === 'ok') { const n = num(v); if (n === null && !opt.opcional) { toast('Escribe un valor', 'bad'); return; } cerrarModal(n); return; }
      if (k === 'del') v = v.slice(0, -1);
      else if (k === 'neg') v = v.startsWith('-') ? v.slice(1) : '-' + v;
      else if (k === ',') { if (!v.includes(',')) v = (v === '' || v === '-' ? v + '0' : v) + ','; }
      else if (v.replace('-', '').replace(',', '').length < 5) v += k;
      pintar();
    };
    abrirModal('<button class="x" data-act="cerrar">×</button><h3>' + e(opt.titulo) + '</h3><div class="muted">' + e(opt.sub || '') + '</div>' +
      '<div style="margin-top:14px" id="kpD" class="disp"></div><div id="kpR" class="rangeinfo muted"></div>' +
      '<div class="kp">' + ['1','2','3','4','5','6','7','8','9'].map(k => '<button onclick="__kp(\'' + k + '\')">' + k + '</button>').join('') +
      '<button onclick="__kp(\'' + (opt.sinNegativo ? ',' : 'neg') + '\')">' + (opt.sinNegativo ? ',' : '±') + '</button><button onclick="__kp(\'0\')">0</button>' +
      '<button onclick="__kp(\'del\')">⌫</button>' + (opt.sinNegativo ? '' : '<button onclick="__kp(\',\')" style="grid-column:span 3;min-height:52px;font-size:22px">, (decimal)</button>') +
      '<button class="k-ok" onclick="__kp(\'ok\')">' + (opt.opcional ? 'Aceptar (o dejar en blanco)' : 'Aceptar') + '</button></div>', resolve);
    pintar();
  });
}

/* ---- ¿quién lo hace? ---- */
function elegirAlumno(titulo) {
  return new Promise((resolve) => {
    let g = S.grupoId;
    const pintar = () => {
      const alumnos = act('ALUMNOS').filter(a => String(a.grupoId) === String(g)).sort((a, b) => String(a.nombre).localeCompare(String(b.nombre), 'es'));
      $('#alG').innerHTML = alumnos.map(a => '<button data-act="alSel" data-v="' + e(a.nombre) + '">' + e(a.nombre) + '</button>').join('') +
        '<button class="profe" data-act="alSel" data-v="Profesor/a">👨‍🍳 Lo ha hecho el profe</button>' +
        (alumnos.length ? '' : '<div class="muted" style="grid-column:1/-1">No hay alumnos cargados en este grupo. El jefe de departamento puede añadirlos en Configuración.</div>');
      document.querySelectorAll('#alGr .chip').forEach(c => c.classList.toggle('on', c.dataset.v === String(g)));
    };
    window.__alGrupo = (v) => { g = v; pintar(); };
    abrirModal('<button class="x" data-act="cerrar">×</button><h3>' + e(titulo || '¿Quién lo ha hecho?') + '</h3>' +
      '<div class="muted">Toca tu nombre</div><div class="chips" id="alGr" style="margin-top:10px">' +
      act('GRUPOS').map(gr => '<button class="chip" data-v="' + e(gr.id) + '" onclick="__alGrupo(\'' + e(gr.id) + '\')">' + e(gr.nombre) + '</button>').join('') +
      '</div><div class="al-grid" id="alG"></div>', resolve);

/* ---- medida correctora ---- */
function elegirMedida(tipo, titulo, explicacion) {
  return new Promise((resolve) => {
    const ops = act('MEDIDAS').filter(m => m.tipo === tipo).map(m => m.texto);
    window.__medOtra = () => { const t = $('#medTx').value.trim(); if (!t) { toast('Escribe qué se ha hecho', 'bad'); return; } cerrarModal(t); };
    abrirModal('<button class="x" data-act="cerrar">×</button><h3 style="color:var(--bad)">⚠️ ' + e(titulo || 'Fuera de límite') + '</h3>' +
      '<p style="font-weight:700">' + e(explicacion || '') + '</p><p class="muted">¿Qué se ha hecho para corregirlo? Avisa a tu profesor.</p>' +
      '<div class="list">' + ops.map(o => '<button class="item" data-act="medSel" data-v="' + e(o) + '"><span style="font-size:22px">👉</span><span class="t">' + e(o) + '</span></button>').join('') + '</div>' +
      '<label class="f">Otra medida</label><textarea class="inp" id="medTx" placeholder="Explica qué se ha hecho"></textarea>' +
      '<button class="btn pri big" style="margin-top:12px" onclick="__medOtra()">Guardar esta medida</button>', resolve);

}

/** Pregunta por qué un punto de la lista está mal: opciones del punto + "Otros" con texto libre. */
function elegirMotivo(it) {
  return new Promise((resolve) => {
    const libre = String(it.motivos || '').charAt(0) === '?';
    const pregunta = libre ? String(it.motivos).slice(1) : '';
    const ops = libre ? [] : String(it.motivos || '').split(';').map(x => x.trim()).filter(String);
    const esCam = /^C[aá]maras/.test(it.texto);
    window.__motOtro = () => { const t = $('#motTx').value.trim(); if (!t) { toast('Escribe qué pasa', 'bad'); return; } cerrarModal(libre ? t : 'Otros: ' + t); };
    abrirModal('<button class="x" data-act="cerrar">×</button><h3 style="color:var(--bad)">✖ ' + e(it.texto) + '</h3><p class="muted">' + e(libre ? pregunta : (esCam ? '¿Cuál estaba abierta?' : '¿Qué pasa?')) + '</p>' +
      '<div class="list">' + ops.map(o => '<button class="item" data-act="medSel" data-v="' + e(o) + '"><span style="font-size:22px">👉</span><span class="t">' + e(o) + '</span></button>').join('') + '</div>' +
      '<label class="f">' + (libre ? 'Descripción' : 'Otros (especifica)') + '</label><textarea class="inp" id="motTx" placeholder="' + (libre ? 'Lugar y tipo de insecto o roedor' : 'Explica qué pasa') + '"></textarea>' +
      '<button class="btn pri big" style="margin-top:12px" onclick="__motOtro()">Guardar</button>', resolve);
  });
}

function confirmar(titulo, texto, si, no) {
  return new Promise((resolve) => {
    abrirModal('<h3>' + e(titulo) + '</h3><p>' + e(texto || '') + '</p><div class="grid2" style="margin-top:16px"><button class="btn" data-act="cerrarV" data-v="0">' + e(no || 'Cancelar') + '</button>' +
      '<button class="btn pri" data-act="cerrarV" data-v="1">' + e(si || 'Sí') + '</button></div>', (v) => resolve(v === '1'));
  });
}
function pedirTexto(titulo, texto, placeholder) {
  return new Promise((resolve) => {
    window.__txOk = () => { const t = $('#pTx').value.trim(); if (!t) { toast('Escribe algo', 'bad'); return; } cerrarModal(t); };
    abrirModal('<button class="x" data-act="cerrar">×</button><h3>' + e(titulo) + '</h3><p class="muted">' + e(texto || '') + '</p><textarea class="inp" id="pTx" placeholder="' + e(placeholder || '') + '"></textarea>' +
      '<button class="btn pri big" style="margin-top:12px" onclick="__txOk()">Aceptar</button>', resolve);
    setTimeout(() => { const t = $('#pTx'); if (t) t.focus(); }, 50);
  });
}
/** Enlace a la página de impresión de una etiqueta (modo 'datos' o 'qr'). */
function urlEtiqueta(codigo, modo) {
  return S.urlApp + '?etiqueta=1&token=' + encodeURIComponent(S.token) + '&codigo=' + encodeURIComponent(codigo) + '&modo=' + (modo === 'qr' ? 'qr' : 'datos');
}
function botonesImprimir(codigo) {
  return '<div class="row" style="gap:8px;flex-wrap:wrap;margin-top:10px">' +
    '<a class="btn" style="flex:1;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="' + e(urlEtiqueta(codigo, 'datos')) + '">🖨️ Imprimir con datos</a>' +
    '<a class="btn" style="flex:1;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="' + e(urlEtiqueta(codigo, 'qr')) + '">🖨️ Imprimir con QR</a></div>';
}
function codigoGrande(titulo, codigo, lineas) {
  return new Promise((resolve) => {
    abrirModal('<h3>✅ ' + e(titulo) + '</h3><p class="muted">Imprime la etiqueta o copia este código a mano:</p><div class="code">' + e(codigo) + '</div>' +
      (lineas || []).map(l => '<p style="margin:6px 0;font-size:18px">' + l + '</p>').join('') +
      botonesImprimir(codigo) +
      '<button class="btn pri big" style="margin-top:14px" data-act="cerrar">Hecho</button>', resolve);
  });
}

/* ---------------- arranque y sesión ---------------- */
/** Si la app se abre desde el QR de una etiqueta (…/exec?c=CÓDIGO), devuelve ese código. */
function codigoDeLaUrl() {
  return new Promise((resolve) => {
    try {
      if (!(window.google && google.script && google.script.url)) { resolve(''); return; }
      const t = setTimeout(() => resolve(''), 3000);
      google.script.url.getLocation(loc => { clearTimeout(t); const q = (loc && loc.parameter) || {}; S.pendTipo = q.t === 'm' ? 'm' : ''; resolve(String(q.c || '').trim()); });
    } catch (_) { resolve(''); }
  });
}
async function iniciar() {
  S.cola = store.get('appcc_cola') || [];
  S.token = store.get('appcc_token');
  S.pendCodigo = await codigoDeLaUrl();
  if (S.token) {
    try { await cargarTodo(); return; } catch (err) { if (err.message !== 'SESION') { pintarError(err); return; } }
  }
  try {
    S.publico = await llamar('publico', []); pintarLogin();
    if (S.pendCodigo) toast('Entra con tu PIN para ver la etiqueta ' + S.pendCodigo, 'ok');
  } catch (err) { pintarError(err); }
}
function pintarError(err) {
  $('#app').innerHTML = '<div class="login"><div class="hero"><div class="big">📡</div><h1>No se puede conectar</h1><p class="muted">' + e(err.message === 'RED' ? 'Revisa la conexión a internet.' : err.message) + '</p>' +
    '<button class="btn pri" onclick="location.reload()">Reintentar</button></div></div>';
}
async function cargarTodo() {
  S.avisoSemanaHecho = false;
  const b = await llamar('bootstrap', [S.token]);
  S.user = b.user; S.conf = b.conf; S.ajustes = b.ajustes; S.hoy = b.hoy; S.estado = b.estado; S.urlApp = b.urlApp;
  if (!S.publico || !S.publico.version) llamar('publico', [], { silencio: true }).then(p => { S.publico = p; if (S.view === 'perfil') render(); }).catch(() => {});
  elegirContexto();
  go('home');
  vaciarCola();
  if (S.pendCodigo) {
    const c = S.pendCodigo; S.pendCodigo = '';
    go('codigo', { q: c, t: S.pendTipo || '' });
    cbBuscar();
  }
}
function cerrarSesionLocal() {
  S.token = null; S.user = null; store.del('appcc_token');
  llamar('publico', [], { silencio: true }).then(p => { S.publico = p; pintarLogin(); }).catch(() => pintarLogin());
}
async function salir() {
  if (!(await confirmar('¿Cerrar sesión?', 'La tablet quedará lista para que entre otro profesor.', 'Cerrar sesión'))) return;
  try { await llamar('logout', [S.token], { silencio: true }); } catch (_) {}
  cerrarSesionLocal();
}

function elegirContexto() {
  const turnos = S.estado.turnos || [];
  const hm = ahoraHM();
  if (!turnos.find(t => t.id === S.turnoId)) {
    const t = turnos.find(t => hm <= t.limiteFin) || turnos[turnos.length - 1];
    S.turnoId = t ? t.id : ((S.conf.TURNOS[0] || {}).id || null);
  }
  const deHoy = gruposDeHoy();
  if (!S.grupoId || !byId('GRUPOS', S.grupoId)) S.grupoId = deHoy.length ? deHoy[0] : ((act('GRUPOS')[0] || {}).id || null);
}
function gruposDeHoy() {
  const d = dow(S.hoy);
  const ent = S.conf.HORARIO.filter(h => Number(h.dia) === d && String(h.turnoId) === String(S.turnoId));
  const mios = ent.filter(h => efectivoC(h.profeId, S.hoy) === String(S.user.id)).map(h => String(h.grupoId));
  const todos = ent.map(h => String(h.grupoId));
  return [...new Set(mios.concat(todos))];
}
/** Cocinas del grupo hoy en este turno, por orden de tramo (todo el turno, 1ª-3ª, 4ª-5ª). */
function espaciosDelGrupo() {
  const d = dow(S.hoy), out = [];
  let rows = S.conf.HORARIO.filter(h => Number(h.dia) === d && String(h.turnoId) === String(S.turnoId) && String(h.grupoId) === String(S.grupoId) && h.espacioId);
  // desdoble: si el usuario es uno de los profesores de ese grupo, solo le tocan sus cocinas
  const mias = rows.filter(h => efectivoC(h.profeId, S.hoy) === String(S.user.id));
  if (mias.length) rows = mias;
  rows.sort((a, b) => String(a.tramo || '').localeCompare(String(b.tramo || '')))
    .forEach(h => { if (out.indexOf(String(h.espacioId)) < 0) out.push(String(h.espacioId)); });
  return out;
}
/** La cocina principal del grupo: si hay dos, la primera a la que aún le falta la apertura. */
function espacioDelGrupo() {
  const l = espaciosDelGrupo();
  if (!l.length) return '';
  const E = S.estado || {};
  const pend = l.find(id => !(E.checks || []).some(c => c.turnoId === S.turnoId && String(c.espacioId) === id && c.tipo === 'apertura' && c.hecho));
  return pend || l[0];
}

const VISTAS = {};

/** Lo que requiere atención ahora (incidencias y controles sin hacer), ordenado por urgencia. nivel 0 = urgente, 1 = toca, 2 = cuando puedas. */
function tocaAhora() {
  const E = S.estado, L = [];
  const add = (nivel, ic, t, sub, v, p) => L.push({ nivel, ic, t, sub: sub || '', v, p: p || {} });
  const plural = (n, a, b) => n + ' ' + (n === 1 ? a : b);
  const tT = E.temps.filter(t => t.turnoId === S.turnoId);
  const atras = tT.filter(t => t.atrasado && !t.hecho).length;
  const faltan = tT.filter(t => !t.hecho && !t.atrasado).length;
  if (atras) add(0, '🌡️', 'No has tomado las temperaturas de las cámaras', plural(atras, 'fuera de hora', 'fuera de hora') + ' · ¡Tómalas ya!', 'temps');
  if (faltan) add(1, '🌡️', 'Temperaturas del turno', plural(faltan, 'pendiente', 'pendientes'), 'temps');
  espaciosDelGrupo().forEach(esp => {
    const chk = E.checks.filter(c => c.turnoId === S.turnoId && String(c.espacioId) === String(esp));
    const ap = chk.find(c => c.tipo === 'apertura'), ci = chk.find(c => c.tipo === 'cierre');
    if (ap && !ap.hecho) add(1, '☀️', 'No has hecho el inicio de turno', 'Apertura de ' + nombre('ESPACIOS', esp), 'checklist', { tipo: 'apertura', espacioId: esp });
    else if (ci && !ci.hecho && ap && ap.hecho) add(2, '🌙', 'Cierre de la cocina', nombre('ESPACIOS', esp), 'checklist', { tipo: 'cierre', espacioId: esp });
  });
  if (E.abatEnCurso.length) add(1, '❄️', plural(E.abatEnCurso.length, 'producto en el abatidor', 'productos en el abatidor'), 'Falta registrar la salida', 'abatidor');
  if (E.muestrasDesechar.length) add(1, '🥡', plural(E.muestrasDesechar.length, 'muestra testigo', 'muestras testigo') + ' por desechar', 'Ya ha pasado su plazo', 'servicio');
  const plan = (E.plan || []).filter(c => c.aplica && (c.responsable !== 'jefe' || S.user.jefe));
  const planPend = plan.filter(c => (c.frecuencia === 'diario' && !c.hecho) || c.previoPendiente);
  planPend.slice(0, 3).forEach(c => {
    const doc = c.tipo === 'docPlagas' || c.tipo === 'docAnalisis';
    add(1, c.tipo === 'agua' ? '💧' : (doc ? '📎' : '📋'), c.nombre, doc ? 'Falta subir el documento' : (c.previoPendiente ? 'Quedó sin hacer el periodo anterior' : 'Plan APPCC · hoy'), doc ? 'docs' : 'plan', doc ? { empresa: c.tipo === 'docPlagas' ? 'plagas' : 'analisis' } : { tab: c.frecuencia });
  });
  if (planPend.length > 3) add(1, '📋', plural(planPend.length - 3, 'control más del plan', 'controles más del plan'), 'Plan APPCC', 'plan');
  const misT = E.tareas.filter(t => String(t.grupoId) === String(S.grupoId) && !t.hecha);
  const hoyToca = misT.filter(t => DIA_LETRA[t.dia] === dow(S.hoy)).length;
  if (hoyToca) add(1, '🧽', plural(hoyToca, 'tarea de limpieza hoy', 'tareas de limpieza hoy'), 'Tu grupo', 'limpieza');
  if (S.user.jefe && copiaVencida()) add(1, '💾', 'Haz una copia de seguridad', E.ultimaCopia ? 'La última fue el ' + fc(E.ultimaCopia) : 'Todavía no has hecho ninguna · los datos solo están en esta pantalla', 'copia');
  if (S.user.jefe) { if (E.incidenciasAbiertas) add(1, '⚠️', plural(E.incidenciasAbiertas, 'incidencia abierta', 'incidencias abiertas'), 'De todo el departamento · pendientes de verificar', 'incidencias'); }
  else if (E.incidenciasMias) add(1, '⚠️', plural(E.incidenciasMias, 'incidencia abierta', 'incidencias abiertas') + ' en tu turno', 'Pendiente de revisar', 'incidencias');
  return L.sort((a, b) => a.nivel - b.nivel);
}

function tilesHome() {
  const E = S.estado;
  const tT = E.temps.filter(t => t.turnoId === S.turnoId);
  const hechasT = tT.filter(t => t.hecho).length, atras = tT.filter(t => t.atrasado).length;

  const esp = espacioDelGrupo();
  const chk = E.checks.filter(c => c.turnoId === S.turnoId && String(c.espacioId) === String(esp));

VISTAS.temps = function () {

  const tT = E.temps.filter(t => t.turnoId === S.turnoId);

  tT.forEach(t => { if (!equipos.find(x => x.equipoId === t.equipoId)) equipos.push({ equipoId: t.equipoId, equipo: t.equipo, responsables: t.responsables }); });
  let h = volver('🌡️ Temperaturas') + contexto(false);

  h += '<div class="list">';
  equipos.forEach(q => {
    const eq = byId('EQUIPOS', q.equipoId) || {};
    const slot = (m) => {
      const x = tT.find(t => t.equipoId === q.equipoId && t.momento === m);
      if (!x) return '<div></div>';
      if (x.hecho) return '<div class="slot ' + (x.registro.conforme === false ? 'bad' : 'ok') + '"><small>' + (m === 'inicio' ? 'INICIO' : 'FIN') + '</small><div class="v">' + e(nf(x.registro.valor)) + ' °C</div><small>' + e(x.registro.hora) + ' · ' + e(x.registro.alumno) + (x.registro.tarde ? ' · fuera de hora' : '') + '</small></div>';
      return '<button class="slot' + (x.atrasado ? ' late' : '') + '" data-act="tempTomar" data-eq="' + e(q.equipoId) + '" data-m="' + m + '"><small>' + (m === 'inicio' ? 'INICIO' : 'FIN') + '</small><div class="v">＋</div><small>' + (x.atrasado ? '¡Atrasado! (antes de las ' + e(x.limite) + ')' : 'Antes de las ' + e(x.limite)) + '</small></button>';
    };
    h += '<div class="eq"><div class="nm"><div style="font-weight:900;font-size:19px">' + e(q.equipo) + '</div><div class="muted small">' + rango(num(eq.min), num(eq.max), eq.unidad) + '</div>' +

  });

    otros.map(x => '<button class="item" data-act="tempPuntual" data-eq="' + e(x.id) + '"><span style="font-size:26px">' + (x.tipo === 'caliente' ? '🔥' : (x.tipo === 'congelacion' ? '🧊' : '❄️')) + '</span><span class="grow"><span class="t">' + e(x.nombre) + '</span><div class="d">' + rango(num(x.min), num(x.max), x.unidad) + '</div></span><span class="pill pri">Registrar</span></button>').join('') + '</div>';
  return h;
};
async function tempRegistrar(eqId, momento) {
  const eq = byId('EQUIPOS', eqId); if (!eq) return;
  const min = num(eq.min), max = num(eq.max);
  const v = await teclado({ titulo: eq.nombre, sub: momento === 'puntual' ? 'Medición puntual' : 'Temperatura de ' + momento + ' de turno', min, max, unidad: eq.unidad || '°C' });
  if (v === null || v === undefined) return;
  let vMax = null, vMin = null;
  if ((eq.maxmin === true || eq.maxmin === 'TRUE') && momento === 'inicio') {
    vMax = await teclado({ titulo: 'Termómetro de máximas', sub: 'Temperatura MÁXIMA desde la última lectura (botón MAX). Déjalo en blanco si no lo sabes.', unidad: '°C', opcional: true, max });
    vMin = await teclado({ titulo: 'Termómetro de mínimas', sub: 'Temperatura MÍNIMA desde la última lectura (botón MIN). Déjalo en blanco si no lo sabes.', unidad: '°C', opcional: true, min });
  }
  let medida = '';
  const fuera = !enRango(v, min, max) || (vMax !== null && max !== null && vMax > max) || (vMin !== null && min !== null && vMin < min);
  if (fuera) {
    medida = await elegirMedida('temp', 'Temperatura fuera de límite', eq.nombre + ': ' + v + ' ' + (eq.unidad || '°C') + '. ' + rango(min, max, eq.unidad) + '. Se avisará al jefe de departamento.');
    if (!medida) return;
  }
  const alumno = await elegirAlumno('¿Quién ha tomado la temperatura?');
  if (!alumno) return;
  try {
    const r = await guardar('temp', { equipoId: eqId, momento, turnoId: S.turnoId, valor: v, vMaxReg: vMax, vMinReg: vMin, medida, alumno });
    if (!r.__cola) toast(fuera ? 'Registrado. Se ha creado una incidencia y se ha avisado al jefe.' : 'Temperatura registrada ✔', fuera ? 'bad' : 'ok');
    render();
  } catch (err) { errorUI(err); }
}

async function chkGuardar() {
  const tipo = S.params.tipo, esp = S.params.espacioId;
  const items = itemsChk(tipo, esp);
  const faltan = items.filter(i => S.params.marcas[i.id] === undefined);
  if (faltan.length) { toast('Faltan ' + faltan.length + ' puntos por revisar', 'bad'); return; }
  const lista = items.map(i => ({ texto: i.texto, ok: S.params.marcas[i.id] === true, motivos: i.motivos }));
  let medida = '';
  for (const it of lista) {
    if (it.ok) continue;
    const m = await elegirMotivo(it);
    if (!m) return;
    it.motivo = m;
  }
  lista.forEach(i => { delete i.motivos; });
  const mal = lista.filter(i => !i.ok);
  if (mal.length) { medida = await elegirMedida('checklist', 'Hay puntos que no están bien', mal.map(i => i.texto + (i.motivo ? ' (' + i.motivo + ')' : '')).join(' · ')); if (!medida) return; }
  const alumno = await elegirAlumno('¿Quién ha hecho la revisión?');
  if (!alumno) return;
  try {
    const r = await guardar('checklist', { tipo, espacioId: esp, turnoId: S.turnoId, grupoId: S.grupoId, items: lista, medida, alumno, obs: (S.params.obs || '').trim() });
    if (!r.__cola) toast((tipo === 'apertura' ? 'Apertura' : 'Cierre') + ' registrada ✔', 'ok');
    S.params.marcas = {}; S.params.obs = ''; render();
  } catch (err) { errorUI(err); }
}

async function recGuardar() {

  ['recProvNuevo', 'recProducto', 'recLote', 'recCad', 'recObs'].forEach(k => { const el = document.querySelector('[data-in="' + k + '"]'); if (el) R[{ recProvNuevo: 'proveedorNuevo', recProducto: 'producto', recLote: 'lote', recCad: 'caducidad', recObs: 'obs' }[k]] = el.value.trim(); });
  if (!R.proveedorId || (R.proveedorId === '__nuevo' && !R.proveedorNuevo)) { toast('Elige el proveedor', 'bad'); return; }
  if (!R.producto) { toast('Escribe el producto', 'bad'); return; }
  if (!R.categoriaId) { toast('Elige el tipo de producto', 'bad'); return; }
  const cat = byId('CATEGORIAS', R.categoriaId), tMax = cat ? num(cat.tempMax) : null;
  if (tMax !== null && (R.temp === undefined || R.temp === null)) { toast('Falta medir la temperatura', 'bad'); return; }
  const prob = [];
  if (tMax !== null && R.temp > tMax) prob.push('temperatura ' + R.temp + ' °C (máx. ' + tMax + ')');
  if (R.envaseOk === false) prob.push('envase'); if (R.etiquetaOk === false) prob.push('etiquetado'); if (R.transporteOk === false) prob.push('transporte');
  if (R.caducidad && R.caducidad < S.hoy) prob.push('caducado');
  let medida = '';
  if (prob.length) { medida = await elegirMedida('recepcion', 'Mercancía con problemas', R.producto + ': ' + prob.join(', ')); if (!medida) return; }
  const alumno = await elegirAlumno('¿Quién ha recibido la mercancía?');
  if (!alumno) return;
  try {
    const d = Object.assign({}, R, { proveedorId: R.proveedorId === '__nuevo' ? '' : R.proveedorId, medida, alumno });
    const r = await guardar('recepcion', d);
    if (!r.__cola) { toast('Recepción registrada ✔', 'ok'); if (R.proveedorId === '__nuevo') { try { const b = await llamar('bootstrap', [S.token], { silencio: true }); S.conf = b.conf; } catch (_) {} } }
    S.params.r = { envaseOk: true, etiquetaOk: true, transporteOk: true, proveedorId: R.proveedorId === '__nuevo' ? '' : R.proveedorId };
    render();
  } catch (err) { errorUI(err); }
}

function horLeer() {
  document.querySelectorAll('[data-hf]').forEach(el => { const [i, k] = el.dataset.hf.split('|'); if (S.params.filas[Number(i)]) S.params.filas[Number(i)][k] = el.value; });
}
async function horGuardar() {
  horLeer();
  const filas = S.params.filas.filter(r => r.grupoId || r.espacioId || r.profeId);
  const vistos = {};
  // Un mismo grupo puede tener varias filas el mismo día: desdoble (dos cocinas y dos profesores a la vez) o cambio antes/después del recreo.
  // Solo se rechaza lo imposible: dos filas del mismo grupo que se solapan con la misma cocina o con el mismo profesor.
  const solapan = (a, b) => !a || !b || a === b;
  for (let x = 0; x < filas.length; x++) for (let y = x + 1; y < filas.length; y++) {
    const A = filas[x], B = filas[y];
    if (!A.grupoId || String(A.grupoId) !== String(B.grupoId) || String(A.dia) !== String(B.dia) || String(A.turnoId) !== String(B.turnoId)) continue;
    if (!solapan(String(A.tramo || ''), String(B.tramo || ''))) continue;
    const sinCocina = !A.espacioId || !B.espacioId, mismaCocina = !sinCocina && String(A.espacioId) === String(B.espacioId), mismoProfe = A.profeId && String(A.profeId) === String(B.profeId);
    if (sinCocina || mismaCocina || mismoProfe) {
      toast('El grupo "' + nombre('GRUPOS', A.grupoId) + '" tiene dos filas el ' + (DIAS[A.dia] || A.dia) + ' a la misma hora ' + (sinCocina ? 'y falta indicar la cocina' : (mismoProfe ? 'con el mismo profesor' : 'en la misma cocina')) + '. Para un desdoble pon otra cocina y otro profesor; si cambia antes/después del recreo, indícalo en "Horas".', 'bad'); return;
    }
  }
  try {
    S.conf.HORARIO = await llamar('guardarLista', [S.token, 'HORARIO', filas]); S.params.filas = null;
    const b = await llamar('estado', [S.token], { silencio: true }); S.estado = b.estado; elegirContexto();
    toast('Horario guardado ✔', 'ok'); render();
  } catch (err) { errorUI(err); }
}
function horReemplazar() {
  horLeer();
  window.__repOk = () => {
    const a = $('#repA').value, b = $('#repB').value;
    if (!a || !b || a === b) { toast('Elige dos profesores distintos', 'bad'); return; }
    let n = 0; S.params.filas.forEach(r => { if (String(r.profeId) === a) { r.profeId = b; n++; } });
    cerrarModal(null); toast(n + ' clase' + (n === 1 ? '' : 's') + ' cambiada' + (n === 1 ? '' : 's') + '. Pulsa Guardar para confirmar.', 'ok'); render();

async function planRegistrar(id, previo) {
  const c = (S.estado.plan || []).find(x => x.id === id); if (!c) return;
  if (ES_DOC(c)) { go('docs', { empresa: c.tipo === 'docPlagas' ? 'plagas' : 'analisis' }); return; }
  let valor = '', aspectoOk = true, conforme = true, medida = '';
  if (c.tipo === 'agua') {
    const v = await teclado({ titulo: 'Cloro libre residual', sub: 'Mídelo con el kit en un grifo de la cocina', min: c.cloroMin, max: c.cloroMax, unidad: 'mg/l', sinNegativo: true });
    if (v === null || v === undefined) return;
    valor = v;
    const a = await bienMal('Aspecto, olor y sabor', 'El agua es clara y no huele ni sabe raro', 'Si no está bien, no se usa y se avisa a la dirección y a EMASA.');
    if (a === null) return;
    aspectoOk = a;
    conforme = enRango(v, c.cloroMin === undefined ? null : c.cloroMin, c.cloroMax === undefined ? null : c.cloroMax) && a;
  } else {
    const r = await bienMal(c.nombre, '¿Está todo correcto?', c.instrucciones);
    if (r === null) return;
    conforme = r;
  }
  if (!conforme) {
    medida = await elegirMedida('plan', 'Hay un problema', c.nombre + '. Se creará una incidencia.');
    if (!medida) return;
  }
  let alumno = '';
  if (c.responsable === 'alumnado') { alumno = await elegirAlumno('¿Quién lo ha hecho?'); if (!alumno) return; }
  try {
    const r = await guardar('plan', { controlId: id, valor, aspectoOk, conforme, medida, alumno, previo: !!previo });
    if (!r.__cola) toast(conforme ? 'Registrado ✔' : 'Registrado. Se ha creado una incidencia.', conforme ? 'ok' : 'bad');
    render();
  } catch (err) { errorUI(err); }
}

function comprimirImagen(file, maxLado, calidad) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, maxLado / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', calidad));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('No se ha podido leer la foto. Prueba con otra o con un PDF.')); };
    img.src = url;
  });
}
function leerComoDataUrl(file) {
  return new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = () => reject(new Error('No se ha podido leer el archivo.')); r.readAsDataURL(file); });
}
async function docGuardar() {
  docLeer();
  const N = S.params.nuevo;
  if (!N.titulo || !N.titulo.trim()) { toast('Pon un título', 'bad'); return; }
  if (!N.file) { toast('Falta el archivo: haz una foto o elige un PDF', 'bad'); return; }
  if ((N.tipo === 'resultado' || (N.tipo === 'visita' && N.empresa === 'plagas')) && !N.resultado) { toast('Indica si el resultado es conforme o no', 'bad'); return; }
  try {
    cargando(true);
    let dataUrl, mime;
    if (N.file.type === 'application/pdf') {
      if (N.file.size > 7 * 1024 * 1024) throw new Error('El PDF pesa más de 7 MB. Comprímelo o haz una foto.');
      dataUrl = await leerComoDataUrl(N.file); mime = 'application/pdf';
    } else if (/^image\//.test(N.file.type)) {
      dataUrl = await comprimirImagen(N.file, 1800, 0.8); mime = 'image/jpeg';
    } else throw new Error('Solo se admiten PDF o fotos.');
    const meta = { empresa: N.empresa, tipo: N.tipo, titulo: N.titulo, fechaDoc: N.fechaDoc, resultado: N.resultado || '', codigos: N.codigos || '', obs: N.obs || '', mime };
    const r = await llamar('subirDocumento', [S.token, meta, dataUrl.split(',')[1]], { silencio: true });
    cargando(false);
    S.estado = r.estado;
    toast(N.resultado === 'no conforme' ? 'Documento guardado. Se ha creado una incidencia.' : 'Documento guardado ✔', N.resultado === 'no conforme' ? 'bad' : 'ok');
    S.params = { empresa: N.empresa };
    render();
  } catch (err) { cargando(false); errorUI(err); }
}

function cfgCampo(c, valor, i) {

  recCat: (el) => { recLeer(); S.params.r.categoriaId = el.dataset.id; render(); },
  recTog: (el) => { recLeer(); S.params.r[el.dataset.k] = el.dataset.v === '1'; render(); },
  recTemp: async () => { recLeer(); const c = byId('CATEGORIAS', S.params.r.categoriaId); const v = await teclado({ titulo: 'Temperatura al llegar', sub: 'Mide con la sonda entre dos envases o en el producto', max: c ? num(c.tempMax) : null, unidad: '°C' }); if (v !== null && v !== undefined) S.params.r.temp = v; render(); },
  recGuardar: () => recGuardar(),
  muDesechar: async (el) => { if (!(await confirmar('¿Muestra desechada?', 'Se anotará que la has tirado hoy.', 'Sí, desechada'))) return; try { S.estado = await llamar('eliminarMuestra', [S.token, el.dataset.id]); toast('Anotado ✔', 'ok'); render(); } catch (err) { errorUI(err); } },
  muTomar: (el) => { const s = S.estado.serviciosHoy.find(x => x.id === el.dataset.s); const p = s ? arr(s.platos).find(x => x.nombre === el.dataset.p) : null; muTomar(el.dataset.s, el.dataset.p, p ? p.alergenos : []); },
  muSuelta: async () => { const p = await pedirTexto('Muestra suelta', '¿De qué plato o elaboración?', 'Ej.: Ensaladilla del evento'); if (p) muTomar('', p, []); },
  svTipo: (el) => { svLeer(); S.params.n.tipo = el.dataset.v; render(); },
  svAl: (el) => { svLeer(); const p = S.params.n.platos[Number(el.dataset.i)]; const k = p.alergenos.indexOf(el.dataset.v); if (k >= 0) p.alergenos.splice(k, 1); else p.alergenos.push(el.dataset.v); render(); },
  svAnadir: () => { svLeer(); S.params.n.platos.push({ nombre: '', alergenos: [] }); render(); },
  svQuitar: (el) => { svLeer(); S.params.n.platos.splice(Number(el.dataset.i), 1); render(); },
  svGuardar: () => svGuardar(),
  etTipo: (el) => { etLeer(); S.params.t.tipo = el.dataset.v; render(); },
  etDias: (el) => { etLeer(); S.params.t.dias = Number(el.dataset.v); render(); },
  etCons: (el) => { etLeer(); S.params.t.conservacion = el.dataset.v; render(); },
  etAl: (el) => { etLeer(); const a = S.params.t.alergenos; const k = a.indexOf(el.dataset.v); if (k >= 0) a.splice(k, 1); else a.push(el.dataset.v); render(); },
  etGuardar: () => etGuardar(),
  cbBuscar: () => cbBuscar(),
  acMedir: (el) => acMedir(el.dataset.id),
  abMeter: () => abMeter(),
  abSacar: (el) => abSacar(el.dataset.id),
  tmVerificar: () => tmVerificar(),
  incTodas: (el) => { S.params.todas = el.dataset.v === '1'; S.params.lista = null; render(); },
  incCerrar: (el) => incCerrar(el.dataset.id),
  incNueva: () => incNueva(),
  hiHoja: (el) => { S.params.hoja = el.dataset.v; S.params.lista = null; render(); },
  hiAnular: (el) => hiAnular(el.dataset.id),
  infRapido: (el) => { S.params.desde = el.dataset.d; S.params.hasta = el.dataset.h; render(); },
  horTurno: (el) => { horLeer(); S.params.turnoId = el.dataset.v; render(); },
  horNueva: (el) => { horLeer(); S.params.filas.push({ id: '', dia: Number(el.dataset.d), turnoId: S.params.turnoId, espacioId: '', grupoId: '', profeId: '', tramo: '' }); render(); },
  horBorrar: async (el) => { horLeer(); if (!(await confirmar('¿Quitar esta clase del horario?', 'Recuerda pulsar Guardar horario.', 'Quitar'))) return; S.params.filas.splice(Number(el.dataset.i), 1); render(); },
  horGuardar: () => horGuardar(),
  horReemplazar: () => horReemplazar(),
  cuadSem: (el) => { S.params.lunes = sumarDias(S.params.lunes, Number(el.dataset.v) * 7); S.params.datos = null; render(); },
  suGuardar: () => suGuardar(),
  suBorrar: async (el) => { if (!(await confirmar('¿Eliminar esta sustitución?', 'Los controles pasados conservan el responsable que tenían entonces; el seguimiento volverá a contar al titular.', 'Eliminar'))) return; await suGuardarLista((S.conf.SUSTITUCIONES || []).filter(x => x.id !== el.dataset.id), 'Sustitución eliminada'); },
  cuGo: () => cuGo(),
  planSec: (el) => { S.params.sec[el.dataset.v] = !S.params.sec[el.dataset.v]; render(); },
  infSec: (el) => { S.params.sec[el.dataset.v] = !S.params.sec[el.dataset.v]; render(); },
  ntGuardar: async () => { const t = $('#ntT').value.trim(); if (!t) { toast('Escribe la nota', 'bad'); return; } try { S.params.datos.notas = await llamar('guardarNota', [S.token, $('#ntP').value, t]); toast('Nota guardada ✔', 'ok'); render(); } catch (err) { errorUI(err); } },
  fmSem: (el) => { S.params.lunes = sumarDias(S.params.lunes, Number(el.dataset.v)); S.params.datos = null; render(); },
  fmFirmar: async () => { const c = ($('#fmC') || {}).value || ''; if (!(await confirmar('¿Firmar la semana?', 'Quedará registrado que has revisado los registros de esta semana.', 'Firmar'))) return; try { S.params.datos = await llamar('firmarSemana', [S.token, S.params.lunes, c]); toast('Semana firmada ✔', 'ok'); refrescar(true); render(); } catch (err) { errorUI(err); } },
  pinCambiar: () => pinCambiar(),
  cfgAbrir: (el) => { S.params = { lista: el.dataset.v }; render(); },
  cfgAjustes: () => { S.params = { ajustes: true }; render(); },
  cfgVolver: () => { S.params = {}; render(); },
  cfgNueva: () => { cfgLeer(); const n = { activo: true }; if (S.params.lista === 'ALUMNOS' && S.params.filtroGrupo) n.grupoId = S.params.filtroGrupo; if (S.params.lista === 'PROFES') n.rol = 'profe'; S.params.filas.push(n); render(); setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 30); },
  cfgBorrar: async (el) => { cfgLeer(); if (!(await confirmar('¿Eliminar esta fila?', 'Si solo quieres que deje de aparecer, es mejor marcarla como no activa. Recuerda pulsar Guardar.', 'Eliminar'))) return; S.params.filas.splice(Number(el.dataset.i), 1); render(); },
  cfgGuardar: () => cfgGuardar(),
  cfgRot: (el) => cfgRot(el.dataset.i),
  cfgPin: async (el) => { const p = await pedirPin('PIN para ' + nombre('PROFES', el.dataset.id), 'Entre 4 y 8 cifras. Díselo al profesor; podrá cambiarlo desde su perfil.'); if (!p) return; try { await llamar('resetPin', [S.token, el.dataset.id, p]); toast('PIN asignado ✔', 'ok'); const f = S.params.filas.find(x => x.id === el.dataset.id); if (f) f.tienePin = true; const c = S.conf.PROFES.find(x => x.id === el.dataset.id); if (c) c.tienePin = true; render(); } catch (err) { errorUI(err); } },
  alBulk: () => { cfgLeer(); const g = $('#alBulkG').value; const n = $('#alBulk').value.split('\n').map(s => s.trim()).filter(String); n.forEach(x => S.params.filas.push({ nombre: x, grupoId: g, activo: true })); toast(n.length + ' añadidos. Pulsa Guardar.', 'ok'); render(); },
  ajGuardar: async () => { const filas = []; document.querySelectorAll('[data-aj]').forEach(el => filas.push({ clave: el.dataset.aj, valor: el.value })); try { S.ajustes = await llamar('guardarLista', [S.token, 'CONFIG', filas]); toast('Ajustes guardados ✔', 'ok'); } catch (err) { errorUI(err); } },
  ajCorreo: async () => { try { const r = await llamar('probarCorreo', [S.token]); toast('Correo ' + r, 'ok'); } catch (err) { errorUI(err); } },
  ajResumen: async () => { try { const r = await llamar('resumenAhora', [S.token]); abrirModal('<button class="x" data-act="cerrar">×</button><h3>Resumen de hoy</h3><p class="muted">Correo: ' + e(typeof r === 'string' ? r : r.enviado) + '</p><div class="card">' + (r.html || '') + '</div>'); } catch (err) { errorUI(err); } },
  ajAvisos: async () => { try { toast(await llamar('instalarAvisos', [S.token]), 'ok'); } catch (err) { errorUI(err); } }
};
function recLeer() {
  const R = S.params.r; if (!R) return;
  const map = { recProvNuevo: 'proveedorNuevo', recProducto: 'producto', recLote: 'lote', recCad: 'caducidad', recObs: 'obs' };
  Object.keys(map).forEach(k => { const el = document.querySelector('[data-in="' + k + '"]'); if (el) R[map[k]] = el.value; });
}
function etLeer() { const el = document.querySelector('[data-in="etProd"]'); if (el && S.params.t) S.params.t.producto = el.value; }

const CHG = {
  grupo: (el) => { S.grupoId = el.value; render(); },
  chkEsp: (el) => { S.params.espacioId = el.value; render(); },
  recProv: (el) => { recLeer(); S.params.r.proveedorId = el.value; render(); },
  hiDesde: (el) => { S.params.desde = el.value; S.params.lista = null; render(); },
  hiHasta: (el) => { S.params.hasta = el.value; S.params.lista = null; render(); },
  infDesde: (el) => { S.params.desde = el.value; render(); },
  infHasta: (el) => { S.params.hasta = el.value; render(); },
  sgDesde: (el) => { S.params.desde = el.value; S.params.datos = null; render(); },
  sgHasta: (el) => { S.params.hasta = el.value; S.params.datos = null; render(); },
  cuadAsig: async (el) => {
    try {
      const w = await llamar('asignarTarea', [S.token, el.dataset.sem, el.dataset.t, el.value]);
      const i = S.params.datos.semanas.findIndex(x => x.clave === el.dataset.sem); if (i >= 0 && w) S.params.datos.semanas[i] = w;
      toast('Guardado ✔', 'ok'); render();
    } catch (err) { errorUI(err); render(); }
  },
  cfgFiltroG: (el) => { cfgLeer(); S.params.filtroGrupo = el.value; render(); }
};

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (fn) { if (el.dataset.act !== 'ovClick') ev.preventDefault(); fn(el, ev); }
});
document.addEventListener('change', (ev) => {
  const fi = ev.target.closest('[data-file]');
  if (fi && S.params.nuevo) { docLeer(); S.params.nuevo.file = fi.files && fi.files[0] ? fi.files[0] : null; render(); return; }
  const el = ev.target.closest('[data-chg]');
  if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el);
});

// Refresco automático y reenvío de registros sin conexión.
setInterval(() => { if (S.token && S.view === 'home' && !$('#modal').innerHTML) refrescar(true); }, 120000);
setInterval(() => { if (S.cola.length) vaciarCola(); }, 30000);
window.addEventListener('online', () => vaciarCola());

iniciar();
</script>
</body>
</html>
